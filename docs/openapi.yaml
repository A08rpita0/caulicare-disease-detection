openapi: 3.0.3
info:
  title: CauliCare Inference API
  version: 1.0.0
  description: |
    Image classification service for cauliflower leaf diseases. An uploaded image is validated
    (file type, decoded format, size, quality, and a trained cauliflower-leaf check), classified
    by a CNN and returned with per-class probabilities, a confidence level and a machine-readable
    `decision`.

    **decision**

    | value | meaning |
    |---|---|
    | `accepted` | The top class has probability >= 0.80. |
    | `uncertain` | A prediction is returned but its probability is below 0.80. Do not act on it automatically. |
    | `rejected` | The input was refused before classification (invalid file, poor quality, not a cauliflower leaf). |
    | `error` | The service could not process a valid request (model unavailable, internal error, rate limit). |

    Every JSON response carries `request_id` (also the `X-Request-ID` response header). Send your own
    `X-Request-ID` (8-64 characters of `A-Za-z0-9._-`) to correlate calls with the service's logs.

    Results are screening aids, not a definitive diagnosis. Scores are over-confident: see `GET /api/model`.
servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://caulicare.onrender.com
    description: Hosted demo (free tier; the first request after idle can take over a minute)
tags:
  - name: Inference
  - name: Model
  - name: Service
  - name: Knowledge base
paths:
  /api/predict:
    post:
      tags: [Inference]
      summary: Classify one image
      description: |
        Runs every check, then the CNN. The default response is the full analysis used by the web UI
        (Grad-CAM, affected-area estimate, similar reference images, disease information). Use
        `compact=1` for a small response that skips those extras. The CNN (and Grad-CAM) run on ONNX
        Runtime when the ONNX model is present and verified against the Keras model, otherwise on
        Keras; `inference.backend` says which one answered.

        Identical uploads (same bytes) are answered from a cache (`cached: true`).
      parameters:
        - name: compact
          in: query
          schema: {type: string, enum: ["0", "1"], default: "0"}
          description: "`1` returns only decision, result, quality and timings (no Grad-CAM, affected area or similarity search)."
        - name: explain
          in: query
          schema: {type: string, enum: ["0", "1"], default: "1"}
          description: "`0` skips Grad-CAM. Ignored when `compact=1`."
        - name: top_k
          in: query
          schema: {type: integer, minimum: 1, maximum: 4, default: 3}
          description: Number of ranked classes in `result.top_k`.
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPG, PNG or WEBP, up to 8 MB. The real format is read from the file bytes.
      responses:
        "200":
          description: The image was classified (`accepted` or `uncertain`).
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PredictResponse'}
              examples:
                compact:
                  summary: POST /api/predict?compact=1
                  value:
                    success: true
                    status: ok
                    decision: accepted
                    decision_reason: The top class has 98.7% probability (high confidence).
                    result:
                      label: Black Rot
                      confidence: 0.9871
                      confidence_percent: 98.7
                      confidence_level: high
                      reliable: true
                      top_k:
                        - {label: Black Rot, confidence: 0.9871, percent: 98.7}
                        - {label: Downy Mildew, confidence: 0.0102, percent: 1.0}
                        - {label: Bacterial spot rot, confidence: 0.0021, percent: 0.2}
                    quality: {width: 1024, height: 768, brightness: 96.4, clipped_fraction: 0.0, sharpness: 311.2, vegetation_fraction: 0.62, acceptable: true, looks_like_leaf: true, problems: [], warnings: []}
                    leaf_check: {checked: true, is_cauliflower_leaf: true, score: 0.9932, threshold: 0.717}
                    inference: {backend: onnxruntime, model: model1.h5}
                    timing_ms: {read_upload: 1.2, quality_gate: 38.5, leaf_check: 412.0, decode: 21.7, preprocess: 9.8, inference: 3.1, explanation_render: 0.0, total: 489.6}
                    cached: false
                    request_id: 4f2a9c1e7b3d5a60
        "400": {$ref: '#/components/responses/Rejected'}
        "413": {$ref: '#/components/responses/Rejected'}
        "415": {$ref: '#/components/responses/Rejected'}
        "422":
          description: |
            The image was refused before classification. `code` is one of `corrupt_image`,
            `not_cauliflower_leaf`, `low_quality`, `blank_image`, `decompression_bomb` ...; `status`
            is `not_cauliflower_leaf` or `low_quality` for the two quality refusals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        "429": {$ref: '#/components/responses/RateLimited'}
        "500": {$ref: '#/components/responses/ServerError'}
        "503":
          description: The model is not installed, or the cauliflower-leaf check could not be made (`leaf_check_unavailable`). Nothing is analysed unverified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/predict/batch:
    post:
      tags: [Inference]
      summary: Classify several images in one forward pass
      description: |
        Up to `BATCH_MAX_IMAGES` (default 8) images in the `images` field. Each image goes through
        the same checks as `/api/predict`; images that fail are reported in their own entry and do not
        affect the others, so the response is `200` even when some images are rejected. The accepted
        images are classified together in a single batched forward pass. Only the compact result is
        returned. A batch of N images counts as N requests against the rate limit.
      parameters:
        - name: top_k
          in: query
          schema: {type: integer, minimum: 1, maximum: 4, default: 3}
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items: {type: string, format: binary}
      responses:
        "200":
          description: One entry per uploaded image, in upload order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResponse'}
        "400": {$ref: '#/components/responses/Rejected'}
        "413": {$ref: '#/components/responses/Rejected'}
        "429": {$ref: '#/components/responses/RateLimited'}
        "500": {$ref: '#/components/responses/ServerError'}
        "503":
          description: The model is not installed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/verify:
    post:
      tags: [Inference]
      summary: Check an image without classifying it
      description: The upload, quality and cauliflower-leaf checks of `/api/predict`, without the disease model.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
      responses:
        "200":
          description: The image is a usable cauliflower leaf photo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  status: {type: string, enum: [cauliflower_leaf]}
                  leaf_check: {$ref: '#/components/schemas/LeafCheck'}
                  quality: {type: object}
                  request_id: {type: string}
                  timing_ms: {$ref: '#/components/schemas/Timing'}
        "400": {$ref: '#/components/responses/Rejected'}
        "413": {$ref: '#/components/responses/Rejected'}
        "415": {$ref: '#/components/responses/Rejected'}
        "422":
          description: Refused (same bodies as `/api/predict`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        "429": {$ref: '#/components/responses/RateLimited'}
        "503":
          description: The leaf check could not be made.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/model:
    get:
      tags: [Model]
      summary: Model description, held-out evaluation and reliability thresholds
      responses:
        "200":
          description: Model metadata. `evaluation` was measured once on the held-out test split.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  model: {type: object}
                  serving:
                    type: object
                    description: |
                      `mode` is the configured INFERENCE_BACKEND (`auto`, `onnx` or `tensorflow`);
                      `plain_prediction_backend` and `gradcam_backend` are what actually answers
                      (`onnxruntime`, `tensorflow` or `none`); `onnx` explains the ONNX status.
                  dataset: {type: object}
                  evaluation:
                    type: object
                    properties:
                      set: {type: string}
                      images: {type: integer}
                      accuracy: {type: number}
                      macro_precision: {type: number}
                      macro_recall: {type: number}
                      macro_f1: {type: number}
                      per_class: {type: object}
                      confusion_matrix: {type: object}
                  calibration: {type: object}
                  reliability: {type: object}
                  request_id: {type: string}
  /api/stats:
    get:
      tags: [Service]
      summary: Request counts, decisions and latency percentiles since the process started
      description: In-memory and per process. `/api/health` and `/api/stats` calls are not counted.
      responses:
        "200":
          description: Service statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  uptime_seconds: {type: integer}
                  requests_total: {type: integer}
                  by_status: {type: object, additionalProperties: {type: integer}}
                  decisions: {type: object, additionalProperties: {type: integer}}
                  confidence_levels: {type: object, additionalProperties: {type: integer}}
                  predicted_classes: {type: object, additionalProperties: {type: integer}}
                  served_from_cache: {type: integer}
                  endpoints:
                    type: object
                    description: Per endpoint, latency over the last 500 requests.
                  cache: {type: object}
                  inference: {type: object}
  /api/health:
    get:
      tags: [Service]
      summary: Liveness and configuration (used by the hosting platform)
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  status: {type: string}
                  model_loaded: {type: boolean}
                  inference_backend: {type: string, enum: [onnxruntime, tensorflow]}
                  gradcam_backend: {type: string, enum: [onnxruntime, tensorflow, none]}
                  onnx: {type: string}
                  classes: {type: array, items: {type: string}}
                  leaf_validation: {type: boolean}
                  similarity_search: {type: boolean}
  /api/openapi.yaml:
    get:
      tags: [Service]
      summary: This specification
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: {type: string}
  /api/diseases:
    get:
      tags: [Knowledge base]
      summary: All disease records
      responses:
        "200":
          description: Disease records and the disclaimer.
          content:
            application/json:
              schema: {type: object}
  /api/diseases/{name}:
    get:
      tags: [Knowledge base]
      summary: One disease record
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
          example: black-rot
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: {type: object}
        "404": {$ref: '#/components/responses/Rejected'}
  /api/search:
    get:
      tags: [Knowledge base]
      summary: Symptom search over the knowledge base
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, maxLength: 200}
      responses:
        "200":
          description: Ranked matches.
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: '#/components/responses/Rejected'}
        "429": {$ref: '#/components/responses/RateLimited'}
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema: {type: string, pattern: '^[A-Za-z0-9._-]{8,64}$'}
      description: Optional correlation id, echoed back in the response header and body.
  headers:
    RequestId:
      schema: {type: string}
      description: Id of this request, as written in the service's structured log.
  responses:
    Rejected:
      description: "The request or input was refused (decision `rejected`). `code` says why, for example `no_file`, `unsupported_extension`, `unsupported_mimetype`, `unsupported_format`, `empty_file`, `file_too_large`, `too_many_images`, `invalid_parameter`, `not_found`."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {success: false, error: "Please upload a JPG, PNG, or WEBP image.", code: unsupported_extension, decision: rejected, request_id: 9d41c07be2a35f18}
    RateLimited:
      description: "Too many requests (code `rate_limited`)."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServerError:
      description: The analysis failed on the server (`analysis_failed` or `internal_error`). No internals are exposed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [success, error, code, decision]
      properties:
        success: {type: boolean, enum: [false]}
        error: {type: string}
        code: {type: string}
        decision: {type: string, enum: [rejected, error]}
        request_id: {type: string}
    Refusal:
      type: object
      properties:
        success: {type: boolean, enum: [false]}
        code: {type: string}
        status: {type: string, enum: [not_cauliflower_leaf, low_quality]}
        decision: {type: string, enum: [rejected]}
        title: {type: string}
        message: {type: string}
        reasons: {type: array, items: {type: string}}
        quality: {type: object}
        leaf_check: {$ref: '#/components/schemas/LeafCheck'}
        disclaimer: {type: string}
        request_id: {type: string}
    LeafCheck:
      type: object
      properties:
        checked: {type: boolean}
        is_cauliflower_leaf: {type: boolean}
        score: {type: number, minimum: 0, maximum: 1}
        threshold: {type: number, minimum: 0, maximum: 1}
    RankedClass:
      type: object
      properties:
        label: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        percent: {type: number, minimum: 0, maximum: 100, description: "`confidence` as a percentage, one decimal."}
    Result:
      type: object
      properties:
        label: {type: string, enum: [Bacterial spot rot, Black Rot, Downy Mildew, No disease]}
        confidence: {type: number, minimum: 0, maximum: 1}
        confidence_percent: {type: number, minimum: 0, maximum: 100, description: "`confidence` as a percentage, one decimal."}
        confidence_level: {type: string, enum: [uncertain, moderate, high]}
        reliable: {type: boolean, description: "`true` when decision is `accepted`."}
        top_k: {type: array, items: {$ref: '#/components/schemas/RankedClass'}}
    Timing:
      type: object
      description: |
        Wall-clock milliseconds per stage of this request. Stages that did not run are absent.
        `read_upload` reading the file; `quality_gate` decode and image-quality checks;
        `leaf_check` cauliflower-leaf validation (a call to the similarity service);
        `decode` second decode for the model; `preprocess` resize to 256x256;
        `inference` the CNN forward pass (plus Grad-CAM when requested);
        `explanation_render` Grad-CAM image rendering; `severity` affected-area estimate;
        `similarity_wait` time spent waiting for the similarity search after the CNN finished;
        `total` the whole request.
      additionalProperties: {type: number}
      properties:
        read_upload: {type: number}
        quality_gate: {type: number}
        leaf_check: {type: number}
        decode: {type: number}
        preprocess: {type: number}
        inference: {type: number}
        explanation_render: {type: number}
        severity: {type: number}
        similarity_wait: {type: number}
        total: {type: number}
    PredictResponse:
      type: object
      properties:
        success: {type: boolean, enum: [true]}
        status: {type: string, enum: [ok]}
        decision: {type: string, enum: [accepted, uncertain]}
        decision_reason: {type: string}
        result: {$ref: '#/components/schemas/Result'}
        quality: {type: object}
        leaf_check: {$ref: '#/components/schemas/LeafCheck'}
        inference:
          type: object
          properties:
            backend: {type: string, enum: [onnxruntime, tensorflow]}
            model: {type: string}
        timing_ms: {$ref: '#/components/schemas/Timing'}
        cached: {type: boolean}
        request_id: {type: string}
        disclaimer: {type: string}
        prediction:
          type: object
          description: Full mode only. All class probabilities, runner-up, margin and the Grad-CAM images.
        severity: {type: object, description: Full mode only. Visual affected-area estimate.}
        similar_images: {type: object, description: Full mode only. Visually similar reference images.}
        second_opinion:
          type: object
          description: |
            Full mode only. Compares the disease model with the labels of the most similar reference photos
            (DINOv2 search, a different model). `agrees` is `false` when at least 80% of the neighbours share
            a label that differs from the prediction; the decision then becomes `uncertain`. The predicted
            label itself is never changed. `agrees` is `null` for a split vote, and `available` is `false`
            when the similarity search is unavailable.
        disease: {type: object, description: Full mode only. Knowledge-base record for the predicted class.}
        reasons: {type: array, items: {type: string}}
    BatchItem:
      type: object
      properties:
        index: {type: integer}
        filename: {type: string, description: The upload's file name with unsafe characters replaced.}
        success: {type: boolean}
        decision: {type: string, enum: [accepted, uncertain, rejected]}
        decision_reason: {type: string}
        result: {$ref: '#/components/schemas/Result'}
        code: {type: string, description: Why the image was rejected (only when `success` is false).}
        message: {type: string}
        http_status: {type: integer, description: The status `/api/predict` would have returned for this image.}
    BatchResponse:
      type: object
      properties:
        success: {type: boolean}
        count: {type: integer}
        accepted: {type: integer}
        uncertain: {type: integer}
        rejected: {type: integer}
        results: {type: array, items: {$ref: '#/components/schemas/BatchItem'}}
        inference:
          type: object
          properties:
            backend: {type: string}
            model: {type: string}
            batched_forward_pass_ms: {type: number}
        timing_ms: {$ref: '#/components/schemas/Timing'}
        request_id: {type: string}
